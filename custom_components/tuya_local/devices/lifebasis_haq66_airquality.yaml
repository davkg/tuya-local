name: Air quality monitor
# DP layout matches the Bcetasy PV33 (bcetasy_18in1_airquality) family, except
# 121/122 are swapped (121 = PM10 threshold int, 122 = PM1 alarm string), there
# is no siren/volume (5-7) and no 107-112/124/125. Standard DP names/scales were
# taken from the Tuya cloud schema (category co2bj).
products:
  - id: xodgr2jxnzmqglmw
    manufacturer: LifeBasis
    model: HAQ66
entities:
  - entity: sensor
    class: carbon_dioxide
    dps:
      - id: 2
        type: integer
        name: sensor
        unit: ppm
        class: measurement
  - entity: binary_sensor
    name: CO2 alarm
    class: gas
    category: diagnostic
    dps:
      - id: 1
        type: string
        name: sensor
        mapping:
          - dps_val: alarm
            value: true
          - value: false
  - entity: switch
    name: Alarm
    icon: "mdi:alarm-bell"
    category: config
    dps:
      - id: 13
        type: boolean
        name: switch
  - entity: binary_sensor
    class: battery_charging
    category: diagnostic
    dps:
      - id: 14
        type: string
        name: sensor
        mapping:
          - dps_val: charge
            value: true
          - value: false
  - entity: sensor
    class: battery
    category: diagnostic
    dps:
      - id: 15
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: number
    name: Brightness
    icon: "mdi:brightness-6"
    category: config
    dps:
      - id: 17
        type: integer
        name: value
        unit: "%"
        range:
          min: 10
          max: 100
        mapping:
          - step: 10
  - entity: sensor
    class: temperature
    dps:
      - id: 18
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    class: humidity
    dps:
      - id: 19
        type: integer
        name: sensor
        unit: "%"
        class: measurement
      - id: 103
        type: integer
        name: current
  - entity: sensor
    class: pm25
    dps:
      - id: 20
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: sensor
    class: volatile_organic_compounds
    dps:
      - id: 21
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: sensor
    name: Formaldehyde
    class: volatile_organic_compounds
    dps:
      - id: 22
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: number
    name: CO2 alarm threshold
    category: config
    class: carbon_dioxide
    dps:
      - id: 26
        type: integer
        name: value
        unit: ppm
        range:
          min: 800
          max: 2000
        mapping:
          - step: 100
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 31
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: sensor
    class: pm10
    dps:
      - id: 101
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: sensor
    class: pm1
    dps:
      - id: 102
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: number
    name: PM2.5 alarm threshold
    category: config
    class: pm25
    dps:
      - id: 105
        type: integer
        name: value
        unit: ugm3
        range:
          min: 25
          max: 150
        mapping:
          - step: 5
  - entity: binary_sensor
    name: PM2.5 alarm
    class: smoke
    category: diagnostic
    dps:
      - id: 106
        type: string
        name: sensor
        mapping:
          - dps_val: alarm
            value: true
          - value: false
  - entity: sensor
    class: aqi
    dps:
      - id: 113
        type: integer
        name: sensor
        class: measurement
  - entity: binary_sensor
    name: Formaldehyde alarm
    class: gas
    category: diagnostic
    dps:
      - id: 114
        type: string
        name: sensor
        mapping:
          - dps_val: alarm
            value: true
          - value: false
  - entity: binary_sensor
    name: AQI alarm
    class: safety
    category: diagnostic
    dps:
      - id: 115
        type: string
        name: sensor
        mapping:
          - dps_val: alarm
            value: true
          - value: false
  - entity: number
    name: Formaldehyde alarm threshold
    category: config
    class: volatile_organic_compounds
    dps:
      - id: 116
        type: integer
        name: value
        unit: ugm3
        range:
          min: 50
          max: 200
        mapping:
          - step: 50
  - entity: binary_sensor
    name: TVOC alarm
    class: gas
    category: diagnostic
    dps:
      - id: 117
        type: string
        name: sensor
        mapping:
          - dps_val: alarm
            value: true
          - value: false
  - entity: number
    name: TVOC alarm threshold
    category: config
    class: volatile_organic_compounds
    dps:
      - id: 118
        type: integer
        name: value
        unit: ugm3
        range:
          min: 300
          max: 1500
        mapping:
          - step: 100
  - entity: number
    name: AQI alarm threshold
    category: config
    dps:
      - id: 119
        type: integer
        name: value
        range:
          min: 50
          max: 150
  - entity: number
    name: PM1 alarm threshold
    category: config
    class: pm1
    dps:
      - id: 120
        type: integer
        name: value
        unit: ugm3
        range:
          min: 25
          max: 150
        mapping:
          - step: 5
  - entity: number
    name: PM10 alarm threshold
    category: config
    class: pm10
    dps:
      - id: 121
        type: integer
        name: value
        unit: ugm3
        range:
          min: 50
          max: 250
        mapping:
          - step: 5
  - entity: binary_sensor
    name: PM1 alarm
    class: smoke
    category: diagnostic
    dps:
      - id: 122
        type: string
        name: sensor
        mapping:
          - dps_val: alarm
            value: true
          - value: false
  - entity: binary_sensor
    name: PM10 alarm
